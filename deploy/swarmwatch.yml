# swarmwatch: read-only Docker Swarm overview. Run this on a swarm MANAGER, once per swarm.
#
# By default nothing is published to the network: swarmwatch only listens on its own overlay network
# (swarmwatch_net), which other stacks can join to read the API. Pick what you need:
#
#   internal only (an app on swarmwatch_net reads the API):
#     docker stack deploy -c swarmwatch.yml swarmwatch
#   with the web UI on a published port (no login, trusted networks only, see SECURITY.md):
#     docker stack deploy -c swarmwatch.yml -c swarmwatch.publish.yml swarmwatch
#   with an API token from a Docker secret (recommended whenever anything else can reach it):
#     openssl rand -hex 32 | docker secret create swarmwatch_token -
#     docker stack deploy -c swarmwatch.yml -c swarmwatch.token.yml swarmwatch
#
# Files can be combined: -c swarmwatch.yml -c swarmwatch.publish.yml -c swarmwatch.token.yml
#
# Settings come from the environment of the `docker stack deploy` command; every one is optional:
#
#   SWARMWATCH_IMAGE         image to run; pin a release, e.g. ghcr.io/ardean/swarmwatch:0.4.1
#   SWARMWATCH_NAME          swarm name shown in the UI                      (default: swarm)
#   SWARMWATCH_NETWORK       name of the overlay network others join         (default: swarmwatch_net)
#   SWARMWATCH_DISABLE_UI    1 = serve only /api and /healthz, no web pages  (default: pages on)
#   SWARMWATCH_DISKS         extra mount points to report, comma separated   (default: none)
#   SWARMWATCH_PEERS         base URLs of other swarmwatch instances whose Traefik proxies to this swarm
#   SWARMWATCH_PEER_TOKEN    bearer token for those peers, if they require one
#   SWARMWATCH_ALLOW_CLEAN   1 = show the "remove unused images/containers" button (default: off)
#   SWARMWATCH_ALLOW_UPDATE  1 = show an "update" button on services with a newer image (default: off)
#   SWARMWATCH_UPDATE_SCHEDULE  cron expression, e.g. "0 4 1 * *" = 04:00 on the 1st, in TZ; updates all
#                            services with a newer image behind their tag on that schedule (default: never)
#   SWARMWATCH_UPDATE_WAIT   seconds to wait after each updated service            (default: 60)
#   SWARMWATCH_UPDATE_CLEANUP  1 = remove unused images after an update run        (default: off)
#   SWARMWATCH_SCAN_WINDOW   when vulnerability scans may start, e.g. 02:00-05:00 in TZ (default: any time)
#   SWARMWATCH_MEMORY_LIMIT  memory cap of the container                      (default: 2G)
#                            Idle use is ~30 MB; the cap guards the manager against a runaway Trivy scan
#                            of a very large image. Too low gets the container killed mid-scan.
#   SWARMWATCH_CPU_LIMIT     CPU cap, e.g. 0.5 for half a core                (default: 0 = no cap)
#                            Trivy uses a core or more while it scans; cap it on a small manager.
#   SWARMWATCH_DOCKER_CONFIG path of the manager's docker config.json, to check private registries
#                            (default: none; swarmwatch then sees public registries only)
#   TZ                       time zone for the UI and the scan window        (default: UTC)
#
#   SWARMWATCH_NAME=prod SWARMWATCH_CPU_LIMIT=0.5 docker stack deploy -c swarmwatch.yml swarmwatch
services:
  swarmwatch:
    image: ${SWARMWATCH_IMAGE:-ghcr.io/ardean/swarmwatch:latest}
    read_only: true
    environment:
      SWARMWATCH_NAME: ${SWARMWATCH_NAME:-swarm}
      SWARMWATCH_DISKS: ${SWARMWATCH_DISKS:-}
      SWARMWATCH_PEERS: ${SWARMWATCH_PEERS:-}
      SWARMWATCH_PEER_TOKEN: ${SWARMWATCH_PEER_TOKEN:-}
      SWARMWATCH_ALLOW_CLEAN: ${SWARMWATCH_ALLOW_CLEAN:-}
      SWARMWATCH_ALLOW_UPDATE: ${SWARMWATCH_ALLOW_UPDATE:-}
      SWARMWATCH_UPDATE_SCHEDULE: ${SWARMWATCH_UPDATE_SCHEDULE:-}
      SWARMWATCH_UPDATE_WAIT: ${SWARMWATCH_UPDATE_WAIT:-}
      SWARMWATCH_UPDATE_CLEANUP: ${SWARMWATCH_UPDATE_CLEANUP:-}
      SWARMWATCH_DISABLE_UI: ${SWARMWATCH_DISABLE_UI:-}
      SWARMWATCH_SCAN_WINDOW: ${SWARMWATCH_SCAN_WINDOW:-}
      SWARMWATCH_HOST_ROOT: /host
      TZ: ${TZ:-UTC}
    networks:
      - net
    volumes:
      # Docker API: swarm, service, task and container state. The socket is root-equivalent
      # whatever the :ro flag says; read SECURITY.md.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Vulnerability results, first-seen times and the Trivy database.
      - swarmwatch-data:/data
      # Host filesystem, read-only: disk usage, load, and the Traefik config for exposure analysis.
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
      # Registry logins for the outdated-image check (read-only, used in memory only).
      - ${SWARMWATCH_DOCKER_CONFIG:-/dev/null}:/root/.docker/config.json:ro
      - type: tmpfs
        target: /tmp
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: ${SWARMWATCH_MEMORY_LIMIT:-2G}
          cpus: "${SWARMWATCH_CPU_LIMIT:-0}"

networks:
  net:
    # A fixed name, so another stack can join it with `external: true` and reach http://swarmwatch:8590.
    name: ${SWARMWATCH_NETWORK:-swarmwatch_net}
    driver: overlay
    attachable: true

volumes:
  swarmwatch-data:
