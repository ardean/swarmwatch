# Copy to ~/.config/swarmwatch/config.yaml
swarms:                      # each entry is one independent swarm
  - name: swarm-a
    ssh: swarm-a.local          # ssh to a manager node (alias ok); "local" = this machine
    disks: [/mnt/data]         # optional: extra mounts to report (/ and the Docker root are always shown)
  - name: swarm-b
    ssh: swarm-b.local
    disks: [/mnt/data]

thresholds:
  disk_percent: 85
  mem_percent: 90

scan:
  max_age: 24h                   # rescan images whose Trivy result is older than this
  trivy_image: aquasec/trivy:latest
  window: ""                     # serve only: when automatic scans may start, e.g. "02:00-05:00". Scan now ignores it

serve:                           # only used by `swarmwatch serve`
  listen: ":8590"
  token_file: ""                 # file holding an API token (>= 16 characters), e.g. /run/secrets/swarmwatch_token
  peer_token: ""                 # bearer token sent to peers that require one
  disable_ui: false              # serve only /api and /healthz (no web pages, no clean-up)

update:                          # only used by `swarmwatch serve`; everything off by default
  allow: false                   # show an "update" button on services with a newer image (no login: trusted networks only)
  schedule: ""                   # cron, e.g. "0 4 1 * *" = 04:00 on the 1st of the month in the server's time zone
  wait: 60s                      # pause after each updated service
  cleanup: false                 # remove unused images after an update run

clean:                           # only used by `swarmwatch serve`; off unless a schedule is set
  schedule: ""                   # cron, e.g. "30 3 * * *" = 03:30 every day in the server's time zone
  keep: 7d                       # an unused image stays this long after it was built (rollback without a pull)
  keep_containers: 24h           # the same for stopped containers that are not swarm tasks
